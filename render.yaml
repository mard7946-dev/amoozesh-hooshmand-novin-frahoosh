# Render Blueprint: deploy the independent classroom API and PostgreSQL together.
# After deploying, open the service Environment page to retrieve the generated manager password.
services:
  - type: web
    name: frahoosh-live-classroom
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: frahoosh-classroom-db
          property: connectionString
      - key: PGSSL
        value: require
      - key: ALLOWED_ORIGINS
        value: https://frahoosh-live-classroom.onrender.com
      - key: MANAGER_USERNAME
        value: school-manager
      - key: MANAGER_PASSWORD
        generateValue: true
      - key: MANAGER_DISPLAY_NAME
        value: مدیریت مدرسه
      - key: NATIONAL_ID_HMAC_SECRET
        generateValue: true

databases:
  - name: frahoosh-classroom-db
    databaseName: frahoosh_classroom
    user: frahoosh
    plan: free
