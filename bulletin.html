<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تابلوی اطلاع‌رسانی | فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#10213a;--line:#304765;--text:#f4f7ff;--muted:#a8b8d2;--mint:#63e0c0;--red:#ff6575}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#183658 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#1a2e4a;color:var(--text)}.primary{background:var(--mint);color:#092034;font-weight:bold}.top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.wrap{max-width:1200px;margin:22px auto;padding:0 14px}.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.board{position:relative;min-height:125px;text-align:right;background:linear-gradient(145deg,#142d4c,#0d1c32);padding:16px;border-radius:15px}.board .ico{font-size:30px;display:block;margin-bottom:9px}.board.active{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset;background:linear-gradient(145deg,#1b4057,#102b40)}.board strong{line-height:1.8}.count{position:absolute;left:12px;top:12px;background:#bd263e;color:white;border-radius:30px;min-width:24px;height:24px;padding:2px 7px;text-align:center;font-size:12px;font-weight:bold}.count.zero{display:none}.panel{margin-top:18px;border:1px solid var(--line);background:#0e1b30;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#09162a;color:var(--text)}textarea.field{min-height:130px}.item{padding:14px;border:1px solid var(--line);border-radius:13px;margin-top:10px;background:#11223a}.meta{color:var(--muted);font-size:12px;line-height:2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.muted{color:var(--muted);font-size:12px;line-height:2}.hide{display:none!important}.badge{font-size:11px;border:1px solid #735f31;color:#ffe2a0;border-radius:30px;padding:4px 8px}.badge.live{border-color:#276b57;color:#8ce7cb}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:0 8px}}
</style></head><body>
<header class="top"><div><b style="font-size:19px">📢 تابلوی اطلاع‌رسانی فراهوش</b><div id="who" class="muted">در حال بررسی ورود…</div></div><div><button id="reload">↻ تازه‌سازی</button> <button id="back">بازگشت به پنل</button></div></header>
<main class="wrap"><div id="notice" class="muted" role="status"></div><section id="boards" class="boards"></section>
<section id="composer" class="panel hide"><h3 id="formTitle">ثبت اطلاعیه</h3><form id="form"><div class="grid"><label>تابلو<select id="board" class="field"></select></label><label>عنوان اطلاعیه<input id="title" class="field" maxlength="180" required></label><label>شروع نمایش (شمسی)<input id="start" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="۱۴۰۵/۰۸/۰۸ ۱۴:۳۰"></label><label>پایان نمایش (شمسی، اختیاری)<input id="end" class="field" type="text" inputmode="numeric" autocomplete="off" placeholder="۱۴۰۵/۰۸/۰۸ ۲۳:۵۹"></label></div><label style="display:block;margin-top:12px">متن اطلاعیه<textarea id="body" class="field" maxlength="20000" required></textarea></label><label style="display:block;margin-top:12px">پیوست فایل یا تصویر<input id="attachment" class="field" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"></label><div id="attachmentInfo" class="muted"></div><div class="actions"><button class="primary" type="submit">ثبت اطلاعیه</button><button type="button" id="cancel">انصراف</button></div><p class="muted">اطلاعیه‌های معاونان و مشاوران ابتدا در صف تأیید مدیر قرار می‌گیرند. اطلاعیه‌های مدیر پس از ثبت مستقیم منتشر می‌شوند.</p></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h3 id="listTitle">اطلاعیه‌های منتشرشده</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="showArchived">نمایش بایگانی</button><button id="new" class="primary">＋ ثبت اطلاعیه</button></div></div><div id="items" class="muted">برای مشاهده، یک تابلو را انتخاب کنید.</div></section></main>
<script>
(()=>{const URL='https://gtmmllcxhdejwjjnyzrh.supabase.co',KEY='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP',token=sessionStorage.getItem('frahoosh_novin_access_token')||'',role=(sessionStorage.getItem('frahoosh_novin_role')||'').toLowerCase(),endpoint=URL+'/functions/v1/school-bulletin', $=id=>document.getElementById(id);let data=[],boards={},active=null,editingId=null,showArchived=false;
const icons={management:'🏛️',educational:'📚',cultural:'🏅',counseling:'🧠',administrative:'🗂️'};
const labels={management:'تابلوی مدیریتی',educational:'تابلوی آموزشی',cultural:'تابلوی پرورشی، فرهنگی و ورزشی',counseling:'تابلوی مشاوره‌ای',administrative:'تابلوی امور اداری'};
function msg(t){$('notice').textContent=t}
async function api(action,p={}){if(!token)throw Error('نشست ورود پیدا نشد؛ دوباره وارد شوید');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:JSON.stringify({action,...p})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'خطا در سرویس تابلو');return j}
const persianDateTime=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function faDate(s){return s?persianDateTime.format(new Date(s)):'—'}
function persianDigits(s){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function jalaliParts(date){const p=persianDateTime.formatToParts(date);const get=t=>p.find(x=>x.type===t)?.value||'';return {y:Number(persianDigits(get('year'))),m:Number(persianDigits(get('month'))),d:Number(persianDigits(get('day'))),h:Number(persianDigits(get('hour'))),min:Number(persianDigits(get('minute')))}}
function jalaliInputToIso(value){const v=persianDigits(value).trim();if(!v)return null;const m=v.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/);if(!m)throw Error('تاریخ را به شکل ۱۴۰۵/۰۸/۰۸ یا همراه ساعت ۱۴۰۵/۰۸/۰۸ ۱۴:۳۰ وارد کنید.');const jy=+m[1],jm=+m[2],jd=+m[3],hh=+(m[4]||0),mi=+(m[5]||0);if(jm<1||jm>12||jd<1||jd>31||hh>23||mi>59)throw Error('تاریخ یا ساعت واردشده معتبر نیست.');const target=[jy,jm,jd];let found=null;const center=Date.UTC(jy+621,2,21);for(let i=-190;i<=190;i++){const d=new Date(center+i*86400000);const p=jalaliParts(d);if(p.y===target[0]&&p.m===target[1]&&p.d===target[2]){found=d;break}}if(!found)throw Error('تاریخ شمسی معتبر پیدا نشد.');found.setUTCHours(hh,mi,0,0);return found.toISOString()}
function isoToJalaliInput(value){if(!value)return '';const p=jalaliParts(new Date(value));return [p.y,String(p.m).padStart(2,'0'),String(p.d).padStart(2,'0')].join('/')+' '+String(p.h).padStart(2,'0')+':'+String(p.min).padStart(2,'0')}
function renderBoards(){const root=$('boards');root.innerHTML='';for(const [key,b] of Object.entries(boards)){const count=data.filter(x=>x.board_key===key&&x.status==='published'&&!x.is_read).length;const btn=document.createElement('button');btn.className='board'+(active===key?' active':'');btn.setAttribute('aria-pressed',String(active===key));btn.innerHTML='<span class="ico">'+icons[key]+'</span><strong>'+b.title+'</strong><span class="count '+(count?'':'zero')+'">'+count+'</span>';btn.onclick=()=>{active=active===key?null:key;renderBoards();renderItems()};root.append(btn)}}
function renderItems(){const list=$('items');$('listTitle').textContent=active?labels[active]:'اطلاعیه‌های منتشرشده';list.innerHTML='';if(!active){list.textContent='برای مشاهده اطلاعیه‌ها، یکی از تابلوها را انتخاب کنید.';return}const rows=data.filter(x=>x.board_key===active&&(x.status==='published'||x.status==='pending_manager'||x.status==='rejected'||(role==='manager'&&showArchived&&x.status==='archived')));if(!rows.length){list.textContent='هنوز اطلاعیه‌ای در این تابلو ثبت نشده است.';return}for(const x of rows){const card=document.createElement('article');card.className='item';const state=x.status==='published'?'منتشرشده':x.status==='pending_manager'?'در انتظار تأیید مدیر':x.status==='rejected'?'رد شده':'بایگانی‌شده';card.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(x.title)+'</b><span class="badge '+(x.status==='published'?'live':'')+'">'+state+'</span></div><div class="meta">ثبت‌کننده: '+esc(x.created_by_role)+' · تاریخ ثبت: '+faDate(x.created_at)+(x.ends_at?' · پایان نمایش: '+faDate(x.ends_at):'')+'</div><p style="white-space:pre-wrap;line-height:2">'+esc(x.body)+'</p>';const actions=document.createElement('div');actions.className='actions';if(x.status==='published'&&!x.is_read){const read=document.createElement('button');read.textContent='خواندم';read.onclick=async()=>{try{await api('read',{id:x.id});await load()}catch(e){msg(e.message)}};actions.append(read)}if(x.attachment_path){const file=document.createElement('button');file.textContent='مشاهده / دریافت پیوست';file.onclick=async()=>{try{const z=await api('attachment_url',{id:x.id});window.open(z.url,'_blank','noopener')}catch(e){msg(e.message)}};actions.append(file)}if(x.can_edit){const edit=document.createElement('button');edit.textContent='ویرایش';edit.onclick=()=>editBulletin(x);actions.append(edit)}if(x.can_delete){const del=document.createElement('button');del.textContent='حذف';del.onclick=async()=>{if(!confirm('این اطلاعیه حذف شود؟'))return;try{await api('delete',{id:x.id});msg('اطلاعیه حذف شد');await load()}catch(e){msg(e.message)}};actions.append(del)}if(x.can_approve){const ok=document.createElement('button');ok.className='primary';ok.textContent='تأیید و انتشار';ok.onclick=async()=>{try{await api('approve',{id:x.id});msg('اطلاعیه منتشر شد');await load()}catch(e){msg(e.message)}};const no=document.createElement('button');no.textContent='رد اطلاعیه';no.onclick=async()=>{const reason=prompt('علت رد را بنویسید');if(!reason)return;try{await api('reject',{id:x.id,reason});await load()}catch(e){msg(e.message)}};actions.append(ok,no)}if(role==='manager'&&x.status==='published'){const arch=document.createElement('button');arch.textContent='بایگانی';arch.onclick=async()=>{try{await api('archive',{id:x.id});await load()}catch(e){msg(e.message)}};actions.append(arch)}card.append(actions);list.append(card)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formShow(){editingId=null;$('formTitle').textContent='ثبت اطلاعیه';$('form').reset();$('attachmentInfo').textContent='';const allowed=Object.entries(boards).filter(([k,b])=>b.roles.includes(role));if(!allowed.length){msg('این حساب مجوز ثبت اطلاعیه ندارد.');return}$('board').innerHTML=allowed.map(([k,b])=>'<option value="'+k+'">'+b.title+'</option>').join('');$('composer').classList.remove('hide')}
function editBulletin(x){$('formTitle').textContent='ویرایش اطلاعیه';formShow();editingId=x.id;$('board').value=x.board_key;$('title').value=x.title;$('body').value=x.body;$('start').value=isoToJalaliInput(x.starts_at);$('end').value=isoToJalaliInput(x.ends_at);$('attachmentInfo').textContent=x.attachment_name?'پیوست فعلی: '+x.attachment_name:'';window.scrollTo({top:0,behavior:'smooth'})}
async function load(){try{const r=await api('list');data=r.items||[];boards=r.boards||{};$('who').textContent='نقش: '+role+' · مخاطب تابلوها: دانش‌آموزان و اولیا';renderBoards();renderItems();}catch(e){msg(e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();try{const file=$('attachment').files[0];let attachment=null;if(file){if(file.size>8*1024*1024)throw Error('حجم پیوست باید حداکثر ۸ مگابایت باشد');const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});attachment={name:file.name,type:file.type||'application/octet-stream',data:b64}}const payload={board_key:$('board').value,title:$('title').value,body:$('body').value,starts_at:jalaliInputToIso($('start').value),ends_at:jalaliInputToIso($('end').value),attachment};if(editingId)await api('edit',{id:editingId,...payload});else await api('create',payload);editingId=null;$('form').reset();$('composer').classList.add('hide');msg(role==='manager'?'اطلاعیه مستقیم منتشر شد.':'اطلاعیه برای تأیید مدیر ارسال شد.');await load()}catch(e){msg(e.message)}};
$('new').onclick=formShow;$('showArchived').classList.toggle('hide',role!=='manager');$('showArchived').onclick=()=>{showArchived=!showArchived;$('showArchived').textContent=showArchived?'بازگشت به اطلاعیه‌های جاری':'نمایش بایگانی';renderItems()};$('cancel').onclick=()=>{$('composer').classList.add('hide');editingId=null;$('form').reset()};$('reload').onclick=load;$('back').onclick=()=>location.href='portal.html?step=panel';if(!token)msg('برای استفاده از تابلو باید وارد حساب کاربری شوید.');load();
})();
</script></body></html>
