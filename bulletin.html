<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تابلوی اطلاع‌رسانی | فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#10213a;--line:#304765;--text:#f4f7ff;--muted:#a8b8d2;--mint:#63e0c0;--red:#ff6575}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#183658 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#1a2e4a;color:var(--text)}.primary{background:var(--mint);color:#092034;font-weight:bold}.top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.wrap{max-width:1200px;margin:22px auto;padding:0 14px}.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.board{position:relative;min-height:125px;text-align:right;background:linear-gradient(145deg,#142d4c,#0d1c32);padding:16px;border-radius:15px}.board .ico{font-size:30px;display:block;margin-bottom:9px}.board strong{line-height:1.8}.count{position:absolute;left:12px;top:12px;background:#bd263e;color:white;border-radius:30px;min-width:24px;height:24px;padding:2px 7px;text-align:center;font-size:12px;font-weight:bold}.count.zero{display:none}.panel{margin-top:18px;border:1px solid var(--line);background:#0e1b30;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:9px;background:#09162a;color:var(--text)}textarea.field{min-height:130px}.item{padding:14px;border:1px solid var(--line);border-radius:13px;margin-top:10px;background:#11223a}.meta{color:var(--muted);font-size:12px;line-height:2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.muted{color:var(--muted);font-size:12px;line-height:2}.hide{display:none!important}.badge{font-size:11px;border:1px solid #735f31;color:#ffe2a0;border-radius:30px;padding:4px 8px}.badge.live{border-color:#276b57;color:#8ce7cb}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:0 8px}}
</style></head><body>
<header class="top"><div><b style="font-size:19px">📢 تابلوی اطلاع‌رسانی فراهوش</b><div id="who" class="muted">در حال بررسی ورود…</div></div><div><button id="reload">↻ تازه‌سازی</button> <button id="back">بازگشت به پنل</button></div></header>
<main class="wrap"><div id="notice" class="muted" role="status"></div><section id="boards" class="boards"></section>
<section id="composer" class="panel hide"><h3 id="formTitle">ثبت اطلاعیه</h3><form id="form"><div class="grid"><label>تابلو<select id="board" class="field"></select></label><label>عنوان اطلاعیه<input id="title" class="field" maxlength="180" required></label><label>شروع نمایش<input id="start" class="field" type="datetime-local"></label><label>پایان نمایش (اختیاری)<input id="end" class="field" type="datetime-local"></label></div><label style="display:block;margin-top:12px">متن اطلاعیه<textarea id="body" class="field" maxlength="20000" required></textarea></label><div class="actions"><button class="primary" type="submit">ثبت اطلاعیه</button><button type="button" id="cancel">انصراف</button></div><p class="muted">اطلاعیه‌های معاونان و مشاوران ابتدا در صف تأیید مدیر قرار می‌گیرند. اطلاعیه‌های مدیر پس از ثبت مستقیم منتشر می‌شوند.</p></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h3 id="listTitle">اطلاعیه‌های منتشرشده</h3><button id="new" class="primary">＋ ثبت اطلاعیه</button></div><div id="items" class="muted">برای مشاهده، یک تابلو را انتخاب کنید.</div></section></main>
<script>
(()=>{const URL='https://gtmmllcxhdejwjjnyzrh.supabase.co',KEY='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP',token=sessionStorage.getItem('frahoosh_novin_access_token')||'',role=(sessionStorage.getItem('frahoosh_novin_role')||'').toLowerCase(),endpoint=URL+'/functions/v1/school-bulletin', $=id=>document.getElementById(id);let data=[],boards={},active='management';
const icons={management:'🏛️',educational:'📚',cultural:'🏅',counseling:'🧠',administrative:'🗂️'};
const labels={management:'تابلوی مدیریتی',educational:'تابلوی آموزشی',cultural:'تابلوی پرورشی، فرهنگی و ورزشی',counseling:'تابلوی مشاوره‌ای',administrative:'تابلوی امور اداری'};
function msg(t){$('notice').textContent=t}
async function api(action,p={}){if(!token)throw Error('نشست ورود پیدا نشد؛ دوباره وارد شوید');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+token},body:JSON.stringify({action,...p})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'خطا در سرویس تابلو');return j}
function faDate(s){return s?new Date(s).toLocaleString('fa-IR'):'—'}
function renderBoards(){const root=$('boards');root.innerHTML='';for(const [key,b] of Object.entries(boards)){const count=data.filter(x=>x.board_key===key&&x.status==='published'&&!x.is_read).length;const btn=document.createElement('button');btn.className='board';btn.innerHTML='<span class="ico">'+icons[key]+'</span><strong>'+b.title+'</strong><span class="count '+(count?'':'zero')+'">'+count+'</span>';btn.onclick=()=>{active=key;renderItems()};root.append(btn)}}
function renderItems(){const list=$('items');$('listTitle').textContent=labels[active];list.innerHTML='';const rows=data.filter(x=>x.board_key===active&&(x.status==='published'||x.status==='pending_manager'||x.status==='rejected'));if(!rows.length){list.textContent='هنوز اطلاعیه‌ای در این تابلو ثبت نشده است.';return}for(const x of rows){const card=document.createElement('article');card.className='item';const state=x.status==='published'?'منتشرشده':x.status==='pending_manager'?'در انتظار تأیید مدیر':'رد شده';card.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(x.title)+'</b><span class="badge '+(x.status==='published'?'live':'')+'">'+state+'</span></div><div class="meta">ثبت‌کننده: '+esc(x.created_by_role)+' · تاریخ ثبت: '+faDate(x.created_at)+(x.ends_at?' · پایان نمایش: '+faDate(x.ends_at):'')+'</div><p style="white-space:pre-wrap;line-height:2">'+esc(x.body)+'</p>';const actions=document.createElement('div');actions.className='actions';if(x.status==='published'&&!x.is_read){const read=document.createElement('button');read.textContent='خواندم';read.onclick=async()=>{try{await api('read',{id:x.id});await load()}catch(e){msg(e.message)}};actions.append(read)}if(x.can_approve){const ok=document.createElement('button');ok.className='primary';ok.textContent='تأیید و انتشار';ok.onclick=async()=>{try{await api('approve',{id:x.id});msg('اطلاعیه منتشر شد');await load()}catch(e){msg(e.message)}};const no=document.createElement('button');no.textContent='رد اطلاعیه';no.onclick=async()=>{const reason=prompt('علت رد را بنویسید');if(!reason)return;try{await api('reject',{id:x.id,reason});await load()}catch(e){msg(e.message)}};actions.append(ok,no)}if(role==='manager'&&x.status==='published'){const arch=document.createElement('button');arch.textContent='بایگانی';arch.onclick=async()=>{try{await api('archive',{id:x.id});await load()}catch(e){msg(e.message)}};actions.append(arch)}card.append(actions);list.append(card)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formShow(){const allowed=Object.entries(boards).filter(([k,b])=>b.roles.includes(role));if(!allowed.length){msg('این حساب مجوز ثبت اطلاعیه ندارد.');return}$('board').innerHTML=allowed.map(([k,b])=>'<option value="'+k+'">'+b.title+'</option>').join('');$('composer').classList.remove('hide')}
async function load(){try{const r=await api('list');data=r.items||[];boards=r.boards||{};$('who').textContent='نقش: '+role+' · مخاطب تابلوها: دانش‌آموزان و اولیا';renderBoards();renderItems();}catch(e){msg(e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();try{await api('create',{board_key:$('board').value,title:$('title').value,body:$('body').value,starts_at:$('start').value?new Date($('start').value).toISOString():null,ends_at:$('end').value?new Date($('end').value).toISOString():null});$('form').reset();$('composer').classList.add('hide');msg(role==='manager'?'اطلاعیه مستقیم منتشر شد.':'اطلاعیه برای تأیید مدیر ارسال شد.');await load()}catch(e){msg(e.message)}};
$('new').onclick=formShow;$('cancel').onclick=()=>$('composer').classList.add('hide');$('reload').onclick=load;$('back').onclick=()=>location.href='portal.html?step=panel';if(!token)msg('برای استفاده از تابلو باید وارد حساب کاربری شوید.');load();
})();
</script></body></html>
