name: Frahoosh Android APK Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-publish.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frahoosh-android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
          find "$ANDROID_HOME/platforms" -maxdepth 1 -mindepth 1 -type d -printf '%f\\n'
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -printf '%f\\n'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

      - name: Configure signing key and detect its real alias
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/frahoosh-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "No private-key alias found in the configured keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          test "$(unzip -Z1 "$APK" | grep -c '^classes[0-9]*\\.dex$')" -ge 1

      - name: Verify package and APK signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ir.frahoosh.novin'"
          sha256sum "$APK" | tee "$RUNNER_TEMP/app-release.apk.sha256"
          echo "apk_size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source android/version.properties
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "code=$versionCode" >> "$GITHUB_OUTPUT"
          echo "tag=novin-v$versionCode" >> "$GITHUB_OUTPUT"

      - name: Publish verified APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "فراهوش نوین ${{ steps.version.outputs.name }}"
          body: |
            نسخه اندروید فراهوش نوین

            فایل APK پس از ساخت تمیز، بررسی ساختار ZIP، کنترل شناسه برنامه و تأیید امضای دیجیتال منتشر شده است.
            حجم فایل: ${{ steps.verify.outputs.apk_size }} بایت
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/app-release.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/frahoosh-release.keystore"
