name: Frahoosh Android APK Release

on:
  push:
    paths:
      - ".github/workflows/android-publish.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frahoosh-android-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/frahoosh-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/frahoosh-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Read app version
        id: version
        run: |
          source android/version.properties
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "tag=novin-v$versionName" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "فراهوش نوین ${{ steps.version.outputs.name }}"
          body: |
            نسخه اندروید فراهوش نوین

            فایل APK امضاشده برای نصب روی دستگاه‌های اندرویدی.
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
