name: Validate classroom prototype

on:
  push:
    branches: [main, 'security/multischool-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: frahoosh_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: frahoosh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frahoosh_test -d frahoosh_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: server
        run: npm install --package-lock=false
      - name: Validate page structure and JavaScript syntax
        run: node --check server/src/server.js && node tests/validate.mjs && node tests/validate-jalali-dates.mjs && node tests/validate-bulletin-roles.mjs && node tests/validate-school-reports.mjs
      - name: Exercise authentication, roles, schedule, and room access against PostgreSQL
        env:
          DATABASE_URL: postgresql://frahoosh_test:test-password@127.0.0.1:5432/frahoosh_test
          PGSSL: disable
          E2E_PORT: 8091
        run: node tests/integration.mjs

      - name: Create isolated classroom migration rehearsal database
        env:
          PGPASSWORD: test-password
        run: |
          createdb -h 127.0.0.1 -U frahoosh_test frahoosh_migration_rehearsal
          export PGHOST=127.0.0.1 PGUSER=frahoosh_test PGDATABASE=frahoosh_migration_rehearsal
          psql -v ON_ERROR_STOP=1 -f server/schema.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO classroom_users(role,display_name,username)
          VALUES ('manager','Legacy Manager','legacy-manager'),
                 ('teacher','Legacy Teacher','legacy-teacher'),
                 ('student','Legacy Student','legacy-student');
          INSERT INTO classrooms(title,grade_class,teacher_user_id,room_code,created_by)
          SELECT 'Legacy room','Grade 7 / A',t.id,'LEGACYROOM',m.id
          FROM classroom_users t CROSS JOIN classroom_users m
          WHERE t.username='legacy-teacher' AND m.username='legacy-manager';
          INSERT INTO school_schedule(day_of_week,period,grade_class,teacher_user_id,classroom_id)
          SELECT 'saturday',1,'Grade 7 / A',t.id,c.id
          FROM classroom_users t CROSS JOIN classrooms c WHERE t.username='legacy-teacher';
          SQL
      - name: Apply experimental multi-school expand migration
        env:
          PGPASSWORD: test-password
          PGHOST: 127.0.0.1
          PGUSER: frahoosh_test
          PGDATABASE: frahoosh_migration_rehearsal
        run: psql -v ON_ERROR_STOP=1 -f server/migrations/experimental/001_multischool_expand.sql
      - name: Apply gated contract phase in disposable database
        env:
          PGPASSWORD: test-password
          PGHOST: 127.0.0.1
          PGUSER: frahoosh_test
          PGDATABASE: frahoosh_migration_rehearsal
        run: psql -v ON_ERROR_STOP=1 -f server/migrations/experimental/002_multischool_contract.sql
      - name: Test multi-school coexistence and cross-school reference rejection
        env:
          PGPASSWORD: test-password
          PGHOST: 127.0.0.1
          PGUSER: frahoosh_test
          PGDATABASE: frahoosh_migration_rehearsal
        run: |
          psql -v ON_ERROR_STOP=1 -f server/tests/multischool-migration.test.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM classroom_users WHERE school_id <> '5c8b8880-1346-445c-89d8-3f76275a7ae5') THEN
              RAISE EXCEPTION 'Legacy user tenant mismatch';
            END IF;
            IF EXISTS (SELECT 1 FROM classrooms WHERE school_id <> '5c8b8880-1346-445c-89d8-3f76275a7ae5') THEN
              RAISE EXCEPTION 'Legacy room tenant mismatch';
            END IF;
            IF EXISTS (SELECT 1 FROM school_schedule WHERE school_id <> '5c8b8880-1346-445c-89d8-3f76275a7ae5') THEN
              RAISE EXCEPTION 'Legacy schedule tenant mismatch';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM classroom_users WHERE username='legacy-manager' AND role='manager') THEN
              RAISE EXCEPTION 'Legacy manager row was not preserved';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM classroom_users WHERE username='legacy-teacher' AND role='teacher') THEN
              RAISE EXCEPTION 'Legacy teacher row was not preserved';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM classrooms WHERE room_code='LEGACYROOM') THEN
              RAISE EXCEPTION 'Legacy classroom row was not preserved';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM school_schedule WHERE day_of_week='saturday' AND period=1) THEN
              RAISE EXCEPTION 'Legacy schedule row was not preserved';
            END IF;
          END $$;
          SQL
