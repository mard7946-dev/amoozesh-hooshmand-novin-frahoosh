name: Publish Frahoosh Six-Icon Portal
# Include operational parent, messaging, and reports pages in the deployed site.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'icons/**'
      - 'about.html'
      - 'finance.html'
      - 'portal.html'
      - 'panel-return.js'
      - 'student-module.html'
      - 'platform-admin.html'
      - 'settings.html'
      - 'reports.html'
      - 'jalali-date.js'
      - 'reports-utils.js'
      - 'parent-management.html'
      - 'parent-meetings.html'
      - 'family-invitations.html'
      - 'family-invitations-review.html'
      - 'messages.html'
      - 'bulletin.html'
      - 'users.html'
      - 'directory.html'
      - 'counseling.html'
      - 'exam-center.html'
      - 'classroom.html'
      - 'classroom/index.html'
      - 'classroom/realtime.html'
      - 'classroom/schedule.html'
      - 'classroom/management.html'
      - 'classroom/weekly-schedule-import.js'
      - '.github/workflows/publish-six-icon-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frahoosh-six-icon-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout six-icon portal
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static portal
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js portal.html panel-return.js student-module.html platform-admin.html settings.html reports.html parent-management.html parent-meetings.html family-invitations.html family-invitations-review.html messages.html users.html bulletin.html directory.html counseling.html exam-center.html _site/
          cp finance.html about.html _site/
          printf '%s' "{\\"build\\":\\"$GITHUB_RUN_NUMBER\\",\\"commit\\":\\"${GITHUB_SHA:0:7}\\",\\"built_at\\":\\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\\"}" > _site/build-info.json
          cp jalali-date.js reports-utils.js _site/
          mkdir -p _site/icons
          cp icons/frahoosh-192.svg icons/frahoosh-512.svg _site/icons/
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url=f'icons/frahoosh-{size}.svg', write_to=f'_site/icons/frahoosh-{size}.png', output_width=size, output_height=size)
          PY
          mkdir -p _site/classroom
          cp classroom/index.html _site/classroom/index.html
          cp classroom/realtime.html _site/classroom/realtime.html
          cp classroom/schedule.html _site/classroom/schedule.html
          cp classroom/management.html classroom/weekly-schedule-import.js _site/classroom/
          cp classroom.html _site/classroom.html
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
