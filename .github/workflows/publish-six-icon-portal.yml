name: Publish Frahoosh Six-Icon Portal
# Include operational parent, messaging, and reports pages in the deployed site.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'finance.html'
      - 'portal.html'
      - 'settings.html'
      - 'reports.html'
      - 'jalali-date.js'
      - 'reports-utils.js'
      - 'parent-management.html'
      - 'parent-meetings.html'
      - 'messages.html'
      - 'bulletin.html'
      - 'users.html'
      - 'directory.html'
      - 'counseling.html'
      - 'exam-center.html'
      - 'classroom.html'
      - 'classroom/index.html'
      - 'classroom/management.html'
      - '.github/workflows/publish-six-icon-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frahoosh-six-icon-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout six-icon portal
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static portal
        run: |
          mkdir -p _site
          cp index.html portal.html settings.html reports.html parent-management.html parent-meetings.html messages.html users.html bulletin.html directory.html counseling.html exam-center.html _site/
          cp finance.html about.html _site/
          printf '{\"build\":\"%s\",\"commit\":\"%.7s\",\"built_at\":\"%s\"}\
' \"$GITHUB_RUN_NUMBER\" \"$GITHUB_SHA\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > _site/build-info.json
          cp jalali-date.js reports-utils.js _site/
          mkdir -p _site/classroom
          cp classroom/index.html _site/classroom/index.html
          cp classroom/management.html _site/classroom/management.html
          cp classroom.html _site/classroom.html
          printf 'frahoosh.ir
' > _site/CNAME
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
