name: Publish Frahoosh Six-Icon Portal
# Ensure the latest operational reports page is included in the deployed site.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal.html'
      - 'settings.html'
      - 'reports.html'
      - 'bulletin.html'
      - 'users.html'
      - 'classroom.html'
      - 'classroom/index.html'
      - 'classroom/management.html'
      - '.github/workflows/publish-six-icon-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frahoosh-six-icon-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout six-icon portal
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static portal
        run: |
          mkdir -p _site
          cp index.html portal.html settings.html reports.html users.html bulletin.html _site/
          mkdir -p _site/classroom
          cp classroom/index.html _site/classroom/index.html
          cp classroom/management.html _site/classroom/management.html
          cp classroom.html _site/classroom.html
          printf 'frahoosh.ir\n' > _site/CNAME
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
