name: Validate Portal, Parent Panel, Settings, and School Reports
# Regression checks cover the live school reports dashboard and its API.

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'settings.html'
      - 'reports.html'
      - 'parent-management.html'
      - 'counseling.html'
      - 'exam-center.html'
      - 'directory.html'
      - 'supabase/functions/assessment-center/index.ts'
      - 'supabase/migrations/20261030160000_independent_assessment_builder.sql'
      - 'supabase/functions/family-education/index.ts'
      - 'supabase/migrations/20261030140000_family_invitation_manager_approval.sql'
      - 'supabase/migrations/20261030143000_family_invitation_schoolwide_audience.sql'
      - 'supabase/migrations/20261030150000_family_invitation_batch_approval.sql'
      - 'supabase/functions/parent-management/index.ts'
      - 'supabase/functions/school-settings/index.ts'
      - 'supabase/functions/school-reports/index.ts'
      - 'supabase/migrations/20261030100000_school_settings_and_server_registry.sql'
      - 'index.html'
      - 'tests/validate-novin-portal.mjs'
      - '.github/workflows/validate-novin-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portal, parent panel, settings, reports access, and JavaScript
        run: node tests/validate-novin-portal.mjs
