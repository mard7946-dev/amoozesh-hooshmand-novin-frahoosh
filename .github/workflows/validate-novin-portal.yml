name: Validate Portal, Parent Panel, Settings, Reports, and Commercial Platform
# Regression checks cover the live school reports dashboard and its API.

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'platform-admin.html'
      - 'accept-invite.html'
      - 'supabase/functions/platform-management/index.ts'
      - 'supabase/functions/school-portal-login/index.ts'
      - 'supabase/functions/login-by-username/index.ts'
      - 'supabase/functions/admin-manage-users/index.ts'
      - 'supabase/functions/parent-management/index.ts'
      - 'supabase/functions/parent-meetings/index.ts'
      - 'supabase/functions/family-education/index.ts'
      - 'supabase/migrations/20261107133000_enforce_parent_first_login_password_change.sql'
      - 'supabase/migrations/20261031180000_commercial_platform_management.sql'
      - 'supabase/migrations/20261031190000_school_manager_invitation.sql'
      - 'supabase/migrations/20261031210000_restrict_sensitive_public_rpcs.sql'
      - 'tests/validate-commercial-platform.mjs'
      - 'settings.html'
      - 'reports.html'
      - 'parent-management.html'
      - 'counseling.html'
      - 'exam-center.html'
      - 'directory.html'
      - 'supabase/functions/assessment-center/index.ts'
      - 'supabase/migrations/20261030160000_independent_assessment_builder.sql'
      - 'supabase/functions/family-education/index.ts'
      - 'supabase/migrations/20261030140000_family_invitation_manager_approval.sql'
      - 'supabase/migrations/20261030143000_family_invitation_schoolwide_audience.sql'
      - 'supabase/migrations/20261030150000_family_invitation_batch_approval.sql'
      - 'supabase/functions/parent-management/index.ts'
      - 'supabase/functions/school-settings/index.ts'
      - 'supabase/functions/school-reports/index.ts'
      - 'supabase/migrations/20261030100000_school_settings_and_server_registry.sql'
      - 'index.html'
      - 'finance.html'
      - 'supabase/migrations/20261107150000_atomic_finance_voucher_creation.sql'
      - 'tests/validate-novin-portal.mjs'
      - '.github/workflows/validate-novin-portal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'portal.html'
      - 'platform-admin.html'
      - 'supabase/functions/platform-management/index.ts'
      - 'supabase/functions/school-portal-login/index.ts'
      - 'supabase/functions/login-by-username/index.ts'
      - 'supabase/functions/admin-manage-users/index.ts'
      - 'supabase/functions/parent-management/index.ts'
      - 'supabase/functions/parent-meetings/index.ts'
      - 'supabase/functions/family-education/index.ts'
      - 'supabase/migrations/20261107133000_enforce_parent_first_login_password_change.sql'
      - 'tests/validate-novin-portal.mjs'
      - 'index.html'
      - 'finance.html'
      - 'supabase/migrations/20261107150000_atomic_finance_voucher_creation.sql'
      - 'supabase/migrations/20261031180000_commercial_platform_management.sql'
      - 'supabase/migrations/20261031190000_school_manager_invitation.sql'
      - 'supabase/migrations/20261031210000_restrict_sensitive_public_rpcs.sql'
      - 'tests/validate-commercial-platform.mjs'
      - '.github/workflows/validate-novin-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portal, parent panel, settings, reports access, and JavaScript
        run: node tests/validate-novin-portal.mjs
      - name: Validate commercial platform security and dashboard
        run: node tests/validate-commercial-platform.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check platform management Edge Function
        run: deno check supabase/functions/platform-management/index.ts
      - name: Type-check school portal login Edge Function
        run: deno check supabase/functions/school-portal-login/index.ts
      - name: Type-check username login Edge Function
        run: deno check supabase/functions/login-by-username/index.ts
      - name: Type-check parent account management Edge Function
        run: deno check supabase/functions/admin-manage-users/index.ts
      - name: Type-check parent panel Edge Functions
        run: |
          deno check supabase/functions/parent-management/index.ts
          deno check supabase/functions/parent-meetings/index.ts
          deno check supabase/functions/family-education/index.ts
