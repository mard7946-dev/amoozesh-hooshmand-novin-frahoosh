name: Validate Portal, Settings, and School Reports

on:
  push:
    branches: [main]
    paths:
      - 'portal.html'
      - 'settings.html'
      - 'reports.html'
      - 'supabase/functions/school-settings/index.ts'
      - 'supabase/functions/school-reports/index.ts'
      - 'supabase/migrations/20261030100000_school_settings_and_server_registry.sql'
      - 'index.html'
      - 'tests/validate-novin-portal.mjs'
      - '.github/workflows/validate-novin-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portal, settings, reports access, and JavaScript
        run: node tests/validate-novin-portal.mjs
