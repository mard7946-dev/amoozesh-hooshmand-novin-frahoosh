name: Publish Frahoosh Novin Android Update

on:
  push:
    paths:
      - 'android/version.properties'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "انتشار عمومی در GitHub Releases (برای آزمایش، خاموش بماند)"
        required: true
        type: boolean
        default: false
      release_notes:
        description: "توضیحات بروزرسانی"
        required: false
        type: string
        default: "بهبودها و رفع اشکال‌ها"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing key
        id: release-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          KEYSTORE="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          test -s "$KEYSTORE"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "No private-key alias could be read from the configured keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature and create checksum
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          (cd "$(dirname "$APK_PATH")" && sha256sum app-release.apk) > "$RUNNER_TEMP/app-release.apk.sha256"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$RUNNER_TEMP/app-release.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the exact release APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frahoosh-Novin-Android-Verified-Release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with the verified APK
        if: ${{ inputs.publish_release || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes || 'بهبودها و رفع اشکال‌ها' }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep "^versionCode=" android/version.properties | cut -d= -f2-)
          VERSION_NAME=$(grep "^versionName=" android/version.properties | cut -d= -f2-)
          TAG="novin-v${VERSION_CODE}"
          TITLE="فراهوش نوین ${VERSION_NAME}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          CHECKSUM_PATH="$RUNNER_TEMP/app-release.apk.sha256"
          test -s "$APK_PATH"
          test -s "$CHECKSUM_PATH"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Increase versionCode before publishing; existing releases are never overwritten." >&2
            exit 1
          fi
          gh release create "$TAG" "$APK_PATH" "$CHECKSUM_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES"

      - name: Verify published APK is byte-for-byte identical
        if: ${{ inputs.publish_release || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep "^versionCode=" android/version.properties | cut -d= -f2-)
          TAG="novin-v${VERSION_CODE}"
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p "$RUNNER_TEMP/published-release"
          gh release download "$TAG" --pattern app-release.apk --dir "$RUNNER_TEMP/published-release"
          cmp --silent "$APK_PATH" "$RUNNER_TEMP/published-release/app-release.apk"
          echo "Published APK exactly matches the verified build output."

      - name: Report validation-only run
        if: ${{ !inputs.publish_release }}
        run: |
          {
            echo "## فراهوش نوین – اعتبارسنجی APK"
            echo ""
            echo "- ساخت APK امضاشده: موفق"
            echo "- بررسی امضای APK: موفق"
            echo "- محاسبه SHA-256: موفق"
            echo "- ذخیره Artifact: انجام شد"
            echo "- انتشار عمومی: انجام نشد (حالت آزمایشی)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/release-keystore.jks
