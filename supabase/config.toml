# Guest entry is authorized by a hashed, single-use invitation token inside the function.
# The function still validates normal school JWTs itself for all existing authenticated flows.
[functions.classroom-realtime-token]
verify_jwt = false

# The host login resolves the full name within an active school membership before delegating to school-portal-login.
[functions.classroom-host-login]
verify_jwt = false

[functions.report-cards]
verify_jwt = false

# The function also validates the caller's Supabase user and active school membership.
[functions.smart-exam-designer]
verify_jwt = true
