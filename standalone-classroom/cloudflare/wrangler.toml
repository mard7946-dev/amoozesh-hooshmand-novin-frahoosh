name = "frahoosh-live-classroom-edge"
main = "src/index.js"
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/api/*", "/health"] }
compatibility_date = "2026-10-18"

[observability]
enabled = true
head_sampling_rate = 1

# The GitHub Actions deployment workflow replaces the placeholder database ID
# at deploy time. Never commit real credentials or the D1 ID as a secret.
[[d1_databases]]
binding = "DB"
database_name = "frahoosh-classroom"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_ENV = "cloudflare"
SUPABASE_URL = "https://gtmmllcxhdejwjjnyzrh.supabase.co"
MANAGER_USERNAME = "school-manager"
MANAGER_DISPLAY_NAME = "مدیریت مدرسه"
