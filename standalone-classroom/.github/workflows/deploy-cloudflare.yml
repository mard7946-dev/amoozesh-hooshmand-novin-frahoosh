name: Deploy Frahoosh classroom to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-migration
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: frahoosh-classroom-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Validate required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MANAGER_PASSWORD: ${{ secrets.CLASSROOM_MANAGER_PASSWORD }}
          NATIONAL_ID_HMAC_SECRET: ${{ secrets.NATIONAL_ID_HMAC_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$MANAGER_PASSWORD" || { echo "::error::Missing repository secret CLASSROOM_MANAGER_PASSWORD"; exit 1; }
          test "${#NATIONAL_ID_HMAC_SECRET}" -ge 32 || { echo "::error::NATIONAL_ID_HMAC_SECRET must contain at least 32 characters"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Missing repository secret SUPABASE_ANON_KEY"; exit 1; }

      - name: Verify Cloudflare account access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json')"
          http_code="${response##*$'\n'}"
          payload="${response%$'\n'*}"
          if [ "$http_code" != "200" ] || ! echo "$payload" | jq -e '.success == true and .result.id != null' >/dev/null; then
            echo "::error::Cloudflare token cannot access the configured account. Check the token's account scope and CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi
          echo "Cloudflare account access confirmed."
          
      - name: Find or create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")"
          echo "$response" | jq -e '.success == true' >/dev/null
          database_id="$(echo "$response" | jq -r '.result[] | select(.name == "frahoosh-classroom") | .uuid' | head -n 1)"
          if [ -z "$database_id" ]; then
            created="$(curl --fail-with-body --silent --show-error -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"frahoosh-classroom"}')"
            echo "$created" | jq -e '.success == true' >/dev/null
            database_id="$(echo "$created" | jq -r '.result.uuid')"
          fi
          test -n "$database_id" && test "$database_id" != "null"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$database_id/" wrangler.toml
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute frahoosh-classroom --remote --file=./schema.sql

      - name: Configure runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MANAGER_PASSWORD: ${{ secrets.CLASSROOM_MANAGER_PASSWORD }}
          NATIONAL_ID_HMAC_SECRET: ${{ secrets.NATIONAL_ID_HMAC_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$MANAGER_PASSWORD" | npx wrangler secret put MANAGER_PASSWORD
          printf '%s' "$NATIONAL_ID_HMAC_SECRET" | npx wrangler secret put NATIONAL_ID_HMAC_SECRET
          printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler secret put SUPABASE_ANON_KEY

      - name: Deploy Worker and Persian web assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
