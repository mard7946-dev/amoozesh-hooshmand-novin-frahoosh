name: Validate independent classroom Worker

on:
  push:
    branches:
      - main
      - feat/cloudflare-migration
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < cloudflare/src/index.js
      - name: Check static classroom pages and embedded JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("index.html", "classroom.html"):
              path = Path("cloudflare/public") / name
              assert path.is_file(), f"Missing static page: {path}"
              source = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, flags=re.I | re.S)
              Path(f"/tmp/{name}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/index.html.js
          node --check /tmp/classroom.html.js
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/schema.sql").read_text(encoding="utf-8"))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"classroom_users", "classrooms", "school_schedule", "classroom_sessions", "classroom_events", "classroom_attendance"}
          missing = expected - tables
          assert not missing, f"Missing D1 tables: {sorted(missing)}"
          print("D1 schema validation passed:", ", ".join(sorted(expected)))
          PY
