<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>برنامه کلاس آنلاین | فراهوش نوین</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d2e;--panel2:#18263a;--line:#2c3b50;--text:#eef4ff;--muted:#a7b6cc;--accent:#46d6b0;--blue:#6ea8fe;--gold:#f4c76b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:#101a2a;border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand b{color:var(--accent)}.meta{font-size:12px;color:var(--muted);margin-top:6px}.wrap{width:min(1100px,calc(100% - 24px));margin:22px auto}.intro,.schedule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.intro h1{margin:0 0 8px;font-size:clamp(20px,4vw,28px)}.intro p{color:var(--muted);line-height:1.9;margin:0}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:16px 0}.day{border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:12px 6px;min-width:0}.day[aria-pressed=true]{border-color:var(--accent);background:#153d3a}.day small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}.section-head h2{margin:0;font-size:18px}.muted{font-size:12px;color:var(--muted)}.list{display:grid;gap:10px}.lesson{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px}.period{font-weight:bold;color:var(--gold);line-height:1.8}.period small{display:block;font-weight:normal;color:var(--muted);font-size:11px}.lesson h3{font-size:15px;margin:0 0 7px}.lesson p{font-size:12px;color:var(--muted);margin:0;line-height:1.8}.join{border:1px solid var(--accent);border-radius:10px;background:#153d3a;color:#eafff8;padding:11px 13px;white-space:nowrap}.join:disabled{cursor:not-allowed;border-color:#526174;background:#273548;color:#b8c3d1;opacity:.8}.status{font-size:11px;margin-top:6px;color:var(--muted)}.status.active{color:var(--accent)}.empty,.error{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);line-height:1.9;text-align:center}.error{color:#ffd6a5;border-color:#8a7040}.actions{display:flex;justify-content:flex-end;margin-top:14px}.back{border:1px solid var(--line);border-radius:10px;background:#203451;color:var(--text);padding:10px 13px}@media(max-width:700px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}.lesson{grid-template-columns:70px minmax(0,1fr)}.join{grid-column:1/-1;width:100%}.top{align-items:flex-start;flex-direction:column}}@media(max-width:390px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">فراهوش <b>●</b> کلاس آنلاین</div><div class="meta" id="userMeta">در حال بررسی حساب کاربری…</div></div><button class="back" id="back">بازگشت به پنل</button></header>
<main class="wrap">
<section class="intro"><h1>برنامه هفتگی و روزانه کلاس‌ها</h1><p>روز موردنظر را انتخاب کنید. کلاس‌های همان روز نمایش داده می‌شوند؛ فقط زنگ‌هایی که مدیریت فعال کرده است امکان ورود به تخته دارند.</p></section>
<nav class="days" id="days" aria-label="انتخاب روز هفته"></nav>
<section class="schedule"><div class="section-head"><h2 id="dayTitle">برنامه روزانه</h2><span class="muted" id="daySummary">در حال دریافت برنامه…</span></div><div class="list" id="lessonList"><div class="empty">در حال دریافت برنامه هفتگی…</div></div></section>
<div class="actions"><button class="back" id="reload">به‌روزرسانی برنامه</button></div>
</main>
<script>
const SUPABASE_URL='https://gtmmllcxhdejwjjnyzrh.supabase.co';
const SUPABASE_KEY='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP';
const token=sessionStorage.getItem('frahoosh_novin_access_token')||'';
const days=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
let profile=null,schedule=[],selectedDay='';
const $=id=>document.getElementById(id);
function normalize(v){return String(v||'').replace(/[\u200c\u200f\u202a-\u202e]/g,'').trim();}
function time(v){const s=normalize(v);return s?s.slice(0,5):'ساعت ثبت نشده';}
function notify(text,error=false){$('lessonList').replaceChildren();const n=document.createElement('div');n.className=error?'error':'empty';n.textContent=text;$('lessonList').append(n);}
async function authorize(payload={}){const response=await fetch(SUPABASE_URL+'/functions/v1/classroom-authorize',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.message||'دریافت برنامه کلاس‌ها ناموفق بود.');return data;}
function renderDays(){const root=$('days');root.replaceChildren();for(const day of days){const count=schedule.filter(x=>x.weekday===day).length;const b=document.createElement('button');b.type='button';b.className='day';b.setAttribute('aria-pressed',String(day===selectedDay));const label=document.createElement('span');label.textContent=day;const small=document.createElement('small');small.textContent=count+' زنگ';b.append(label,small);b.addEventListener('click',()=>{selectedDay=day;renderDays();renderDay();});root.append(b);}}
function renderDay(){const todays=schedule.filter(x=>x.weekday===selectedDay).sort((a,b)=>Number(a.period)-Number(b.period)||String(a.start_time).localeCompare(String(b.start_time)));$('dayTitle').textContent='برنامه روزانه '+selectedDay;$('daySummary').textContent=todays.length+' زنگ در برنامه';const list=$('lessonList');list.replaceChildren();if(!todays.length){notify('برای '+selectedDay+' زنگی در برنامه هفتگی شما ثبت نشده است.');return;}for(const lesson of todays){const card=document.createElement('article');card.className='lesson';const period=document.createElement('div');period.className='period';period.textContent='زنگ '+lesson.period;const timing=document.createElement('small');timing.textContent=time(lesson.start_time)+' تا '+time(lesson.end_time);period.append(timing);const details=document.createElement('div');const title=document.createElement('h3');title.textContent=lesson.subject||lesson.title||'درس بدون عنوان';const desc=document.createElement('p');desc.textContent=[lesson.class_name,lesson.teacher].filter(Boolean).join(' · ');const status=document.createElement('div');status.className='status'+(lesson.is_active?' active':'');status.textContent=lesson.is_active?'زنگ فعال است':'هنوز توسط مدیریت فعال نشده است';details.append(title,desc,status);const join=document.createElement('button');join.type='button';join.className='join';join.disabled=!lesson.is_active;join.textContent=lesson.is_active?'ورود به تخته':'در انتظار فعال‌سازی';join.addEventListener('click',async()=>{if(!lesson.is_active)return;join.disabled=true;join.textContent='در حال بررسی مجوز…';try{await authorize({room_id:lesson.id,schedule_entry_id:lesson.schedule_entry_id});location.href='index.html?room_id='+encodeURIComponent(lesson.id)+'&schedule_entry_id='+encodeURIComponent(lesson.schedule_entry_id);}catch(e){join.disabled=false;join.textContent='ورود به تخته';$('daySummary').textContent=e.message||'مجوز ورود تأیید نشد.';}});card.append(period,details,join);list.append(card);}}
async function load(){if(!token){$('userMeta').textContent='نشست معتبر پیدا نشد';notify('برای مشاهده برنامه، ابتدا از پنل فراهوش وارد حساب خود شوید.',true);return;}notify('در حال دریافت برنامه هفتگی…');try{const data=await authorize();profile=data.profile;schedule=Array.isArray(data.schedule)?data.schedule:[];if(!['teacher','student'].includes(String(profile.role||'').toLowerCase()))throw new Error('این صفحه فقط برای دبیر و دانش‌آموز است.');$('userMeta').textContent=(profile.display_name||profile.username||'کاربر')+' · '+(profile.role==='teacher'?'دبیر':'دانش‌آموز')+(profile.class_name?' · '+profile.class_name:'');const today=new Intl.DateTimeFormat('fa-IR',{weekday:'long',timeZone:'Asia/Tehran'}).format(new Date());selectedDay=days.includes(today)?today:days[0];renderDays();renderDay();if(!schedule.length)notify('برای حساب شما برنامه هفتگی فعالی ثبت نشده است. با مدیریت مدرسه بررسی کنید که زنگ‌ها در برنامه هفتگی فعال و به کلاس آنلاین متصل شده باشند.');}catch(e){$('userMeta').textContent='خطا در دریافت برنامه';notify(e.message||'دریافت برنامه هفتگی ناموفق بود.',true);}}
$('back').addEventListener('click',()=>location.href='../portal.html');$('reload').addEventListener('click',load);load();
</script>
</body></html>
