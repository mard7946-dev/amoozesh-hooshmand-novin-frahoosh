<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d33">
<title>تکمیل حساب مدیر مدرسه | فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--line:#304461;--text:#f3f6ff;--muted:#a8b8d2;--mint:#63e0c0}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 12% 4%,#17365a 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}.card{width:min(100%,480px);padding:24px;border:1px solid var(--line);border-radius:18px;background:#0e1b32}h1{font-size:23px;margin:0 0 10px}p{color:var(--muted);line-height:1.9}label{display:block;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#081326;color:var(--text);font:inherit}button,a{display:inline-flex;justify-content:center;margin-top:16px;padding:12px 16px;border:1px solid #63e0c0;border-radius:11px;background:#164b48;color:var(--text);font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:14px;padding:11px;border-radius:10px;background:#162a43;white-space:pre-wrap}.error{background:#452525;color:#ffd5d5}.success{background:#123d34;color:#c9ffeb}[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
<div style="color:var(--mint);font-weight:bold;margin-bottom:12px">FRAHOOSH · SCHOOL ACCOUNT</div>
<h1>تکمیل حساب مدیر مدرسه</h1>
<p>دعوت‌نامه شما تأیید شد. برای فعال‌کردن حساب، یک رمز عبور جدید انتخاب کنید. این رمز فقط در اختیار خودتان باشد.</p>
<form id="setPassword" hidden>
<label for="password">رمز عبور جدید</label>
<input id="password" type="password" minlength="10" autocomplete="new-password" required>
<label for="confirmPassword">تکرار رمز عبور</label>
<input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required>
<button id="submit" type="submit">ثبت رمز و فعال‌سازی حساب</button>
</form>
<div id="status" class="status">در حال بررسی دعوت‌نامه…</div>
<a id="login" href="portal.html?step=login&amp;role=manager" hidden>ورود به پنل مدیر مدرسه</a>
</main>
<script>
const SUPABASE_URL="https://gtmmllcxhdejwjjnyzrh.supabase.co";
const SUPABASE_KEY="sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP";
const statusNode=document.getElementById("status");
const form=document.getElementById("setPassword");
const login=document.getElementById("login");
const hash=new URLSearchParams(location.hash.slice(1));
const accessToken=hash.get("access_token")||"";
const inviteType=hash.get("type")||"";
function show(message,kind=""){statusNode.textContent=message;statusNode.className="status"+(kind?" "+kind:"");}
if(accessToken&&inviteType==="invite"){
  form.hidden=false;
  show("دعوت‌نامه معتبر است. رمز جدید خود را تعیین کنید.");
}else{
  show("پیوند دعوت‌نامه معتبر یا فعال نیست. از مدیر کل بخواهید دعوت‌نامه تازه‌ای ارسال کند.","error");
}
form.addEventListener("submit",async event=>{
  event.preventDefault();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirmPassword").value;
  if(password.length<10){show("رمز عبور باید دست‌کم ۱۰ نویسه داشته باشد.","error");return;}
  if(password!==confirm){show("تکرار رمز عبور با رمز واردشده یکسان نیست.","error");return;}
  const button=document.getElementById("submit");button.disabled=true;show("در حال ثبت رمز عبور…");
  try{
    const response=await fetch(SUPABASE_URL+"/auth/v1/user",{method:"PUT",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+accessToken},body:JSON.stringify({password})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.msg||data.message||"ثبت رمز عبور ناموفق بود.");
    history.replaceState(null,"",location.pathname+location.search);
    form.hidden=true;login.hidden=false;
    show("رمز عبور ثبت شد. اکنون می‌توانید با نام کاربری و رمز جدید وارد پنل مدیر مدرسه شوید.","success");
  }catch(error){show(error.message||"ارتباط با سرویس احراز هویت برقرار نشد.","error");}
  finally{button.disabled=false;}
});
</script>
</body>
</html>
