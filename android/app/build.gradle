plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> value != null && !value.trim().isEmpty() } &&
    file(releaseKeystorePath ?: 'missing-release-keystore').exists()

def appVersion = new Properties()
file('version.properties').withInputStream { appVersion.load(it) }

android {
    namespace 'ir.frahoosh.novin'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.frahoosh.novin'
        minSdk 24
        targetSdk 35
        // Increase versionCode for every published update. Never reset it.
        versionCode appVersion.getProperty('versionCode', '22').toInteger()
        versionName appVersion.getProperty('versionName', '1.0.1')
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Keep the debug package separate, but use the same stable certificate
            // as release whenever the production keystore is available.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
