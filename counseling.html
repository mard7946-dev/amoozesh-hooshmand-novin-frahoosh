<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1730">
<title>مرکز مشاوره | فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#10213a;--line:#304461;--text:#f3f6ff;--muted:#a8b8d2;--mint:#63e0c0;--gold:#f5ce7a;--red:#ff9d9d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#17365a 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#203451;color:var(--text)}button:disabled{opacity:.45;cursor:wait}.primary{background:#135c50;border-color:var(--mint)}.danger{border-color:#8a414b;color:#ffc1c1}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#09162bdc;position:sticky;top:0;z-index:5}.top h1{font-size:18px;margin:0 0 5px}.muted{color:var(--muted);font-size:12px;line-height:1.8}.wrap{max-width:1250px;margin:18px auto;padding:0 14px}.notice{border:1px solid #725b2d;background:#302717;color:#ffe4a5;border-radius:12px;padding:11px 13px;margin-bottom:12px;line-height:1.9;font-size:12px}.notice.error{border-color:#78404b;background:#3c2028;color:#ffb6b6}.notice.ok{border-color:#276b57;background:#12382f;color:#b8ffe8}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{padding:10px;background:#0e1b30;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}.tabs button[aria-selected=true]{border-color:var(--mint);color:var(--mint);background:#15364a}.panel{background:#0e1b30e8;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 12px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.field.full{grid-column:1/-1}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#081326;color:var(--text)}textarea{min-height:78px;resize:vertical}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:right;vertical-align:top;line-height:1.8}th{color:var(--mint);background:#132742;font-size:12px}td{font-size:12px}.rowactions{display:flex;gap:5px;flex-wrap:wrap}.rowactions button{padding:6px 8px;font-size:11px}.hidden{display:none!important}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:12px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px;background:#10213a}.metric strong{display:block;font-size:22px;color:var(--mint);margin-top:6px}@media(max-width:760px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-wrap:wrap}.wrap{padding:0 8px}.panel{padding:11px}}
@media print{body{background:#fff;color:#111}.top,.tabs,.formpanel,.no-print,.notice{display:none!important}.panel{background:#fff;color:#111;border:0}th{color:#111;background:#eee}th,td{border-color:#aaa}table{min-width:0}}
</style>
</head>
<body>
<header class="top"><div><h1>فراهوش · مرکز مشاوره</h1><div class="muted" id="who">در حال بررسی نشست معتبر…</div></div><div class="actions"><button id="refresh">↻ تازه‌سازی</button><button id="exportCsv">خروجی Excel (CSV)</button><button onclick="window.print()">چاپ / PDF</button><button id="back">بازگشت به پنل</button></div></header>
<main class="wrap">
<div id="notice" class="notice" role="status">در حال بررسی نشست و دریافت اطلاعات از پایگاه داده…</div>
<div class="metrics"><div class="metric">پرونده‌های مشاوره<strong id="countRecords">—</strong></div><div class="metric">پیگیری‌های باز<strong id="countFollowups">—</strong></div><div class="metric">ارجاع‌های در انتظار<strong id="countReferrals">—</strong></div></div>
<nav class="tabs" aria-label="بخش‌های مشاوره">
<button data-tab="records" aria-selected="true">پرونده مشاوره</button><button data-tab="followups" aria-selected="false">پیگیری جلسات</button><button data-tab="guidance" aria-selected="false">هدایت تحصیلی</button><button data-tab="referrals" aria-selected="false">ارجاع دانش‌آموز</button><button data-tab="classes" aria-selected="false">کلاس‌های مشاوره</button><button data-tab="board" aria-selected="false">تابلوی مشاور</button>
</nav>
<section class="panel formpanel" id="formPanel"><h2 id="formTitle">ثبت پرونده مشاوره</h2><form id="entryForm"><div class="formgrid" id="fields"></div><div class="actions" style="margin-top:12px"><button class="primary" id="save" type="submit">ثبت اطلاعات</button><button type="button" id="cancelEdit">پاک‌کردن فرم</button></div></form></section>
<section class="panel"><div class="actions" style="justify-content:space-between"><div><h2 id="tableTitle">پرونده‌های ثبت‌شده</h2><div class="muted" id="tableSubtitle">اطلاعات از جدول اختصاصی Supabase خوانده می‌شود.</div></div><input id="search" type="search" placeholder="جستجو در فهرست…" style="max-width:300px"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"><tr><td>در حال دریافت اطلاعات…</td></tr></tbody></table></div></section>
</main>
<script>
const SUPABASE_URL='https://gtmmllcxhdejwjjnyzrh.supabase.co';
const SUPABASE_KEY='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP';
const token=sessionStorage.getItem('frahoosh_novin_access_token')||'';
const role=sessionStorage.getItem('frahoosh_novin_role')||'';
const allowed=['manager','counselor','advisor','educational','executive','cultural'];
const $=id=>document.getElementById(id);
const requestedTab=new URLSearchParams(location.search).get('tab');\nlet tab=['records','followups','guidance','referrals','classes','board'].includes(requestedTab)?requestedTab:'records',rows=[],students=[],editing=null;
const config={
records:{table:'counseling_records',title:'پرونده مشاوره',plural:'پرونده‌های مشاوره',fields:[
['student_id','دانش‌آموز','student',true],['student_name','نام دانش‌آموز','text',true],['visit_reason','علت مراجعه','textarea',true],['session_date','تاریخ جلسه شمسی','text',true],['actions_taken','اقدامات انجام‌شده','textarea',false],['next_visit','تاریخ جلسه بعدی شمسی','text',false],['progress','روند پیشرفت','textarea',false],['result','نتیجه / جمع‌بندی','textarea',false],['status','وضعیت','select',false,['جدید','در حال پیگیری','نیازمند ارجاع','بسته‌شده']]],
cols:[['student_name','نام دانش‌آموز'],['visit_reason','علت مراجعه'],['session_date','تاریخ جلسه'],['actions_taken','اقدامات'],['next_visit','جلسه بعدی'],['progress','پیشرفت'],['result','نتیجه'],['status','وضعیت']]},
followups:{table:'counseling_followups',title:'پیگیری جلسه',plural:'پیگیری‌های مشاوره',fields:[
['student_id','دانش‌آموز','student',true],['subject','موضوع پیگیری','text',true],['description','شرح پیگیری','textarea',true],['followup_date','تاریخ پیگیری شمسی','text',true],['followup_items','اقدامات بعدی','textarea',false],['decision','تصمیم / نتیجه','textarea',false],['status','وضعیت','select',true,['باز','در حال انجام','انجام شد','ارجاع شد']]],
cols:[['student_id','شناسه دانش‌آموز'],['subject','موضوع'],['description','شرح'],['followup_date','تاریخ پیگیری'],['followup_items','اقدامات بعدی'],['decision','نتیجه'],['status','وضعیت']]},
guidance:{table:'counseling_guidance',title:'هدایت تحصیلی',plural:'پرونده‌های هدایت تحصیلی',fields:[
['student_id','دانش‌آموز','student',true],['grade','پایه تحصیلی','text',true],['interest','علایق دانش‌آموز','textarea',false],['aptitude','توانمندی‌ها و استعدادها','textarea',false],['recommendation','توصیه و مسیر پیشنهادی','textarea',true]],
cols:[['student_id','شناسه دانش‌آموز'],['grade','پایه'],['interest','علایق'],['aptitude','توانمندی‌ها'],['recommendation','توصیه مشاور']]},
referrals:{table:'student_referrals',title:'ارجاع دانش‌آموز',plural:'ارجاع‌های دانش‌آموز',fields:[
['student_id','دانش‌آموز','student',true],['referral_to','ارجاع به','select',true,['مشاور','مدیر','معاون آموزشی','معاون اجرایی','معاون پرورشی']],['reason','علت ارجاع','textarea',true],['referral_date','تاریخ ارجاع شمسی','text',true],['status','وضعیت','select',true,['در انتظار بررسی','در حال پیگیری','رسیدگی شد','بسته‌شده']]],
cols:[['student_id','شناسه دانش‌آموز'],['referral_to','ارجاع به'],['reason','علت ارجاع'],['referral_date','تاریخ ارجاع'],['status','وضعیت']]},
classes:{table:'counseling_classes',title:'کلاس مشاوره',plural:'کلاس‌های مشاوره',fields:[
['title','عنوان کلاس','text',true],['grade','پایه','text',false],['subject','موضوع','text',false],['active','وضعیت فعال','select',true,['فعال','غیرفعال']]],
cols:[['title','عنوان'],['grade','پایه'],['subject','موضوع'],['active','وضعیت']]},
board:{table:'counselor_board',title:'اطلاعیه تابلوی مشاور',plural:'اطلاعیه‌های مشاور',fields:[
['title','عنوان اطلاعیه','text',true],['body','متن اطلاعیه','textarea',true],['active','نمایش برای کاربران مجاز','select',true,['فعال','غیرفعال']]],
cols:[['title','عنوان'],['body','متن اطلاعیه'],['active','وضعیت'],['created_at','تاریخ ثبت']]}
};
function showNotice(msg,type=''){ $('notice').textContent=msg;$('notice').className='notice'+(type?' '+type:''); }
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(k,v){if(k==='active')return v?'فعال':'غیرفعال';return v??'';}
async function api(table,method='GET',body=null,id=null){
 const url=new URL(SUPABASE_URL+'/rest/v1/'+table);
 url.searchParams.set('select','*');
 if(id!==null)url.searchParams.set('id','eq.'+id);
 if(method==='GET')url.searchParams.set('order','id.desc');
 const res=await fetch(url.toString(),{method,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:method==='GET'?'return=representation':'return=representation'},...(body?{body:JSON.stringify(body)}:{})});
 const text=await res.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}
 if(!res.ok)throw new Error((data&& (data.message||data.error||data.details))||('خطای پایگاه داده: '+res.status));
 return data;
}
function fieldMarkup(f){
 const [key,label,type,required,opts]=f;let input='';
 if(type==='student'){
  input='<select name="'+key+'" id="f_'+key+'" '+(required?'required':'')+'><option value="">انتخاب دانش‌آموز…</option>'+students.map(s=>'<option value="'+s.id+'">'+esc((s.first_name||'')+' '+(s.last_name||'')+' · '+(s.class_name||s.grade||'')+' · کد '+s.id)+'</option>').join('')+'</select>';
 }else if(type==='textarea')input='<textarea name="'+key+'" id="f_'+key+'" '+(required?'required':'')+' maxlength="6000"></textarea>';
 else if(type==='select')input='<select name="'+key+'" id="f_'+key+'" '+(required?'required':'')+'>'+opts.map((o,i)=>'<option value="'+(key==='active'?(i===0?'true':'false'):esc(o))+'">'+esc(o)+'</option>').join('')+'</select>';
 else input='<input name="'+key+'" id="f_'+key+'" '+(required?'required':'')+' maxlength="500" '+(key.includes('date')||key.includes('visit')?'placeholder="۱۴۰۶/۰۷/۰۸"':'')+'>';
 return '<label class="field '+(type==='textarea'?'full':'')+'">'+esc(label)+input+'</label>';
}
function drawForm(){
 const c=config[tab];$('formTitle').textContent=(editing?'ویرایش ':'ثبت ')+c.title;$('save').textContent=editing?'ذخیره ویرایش':'ثبت اطلاعات';
 $('fields').innerHTML=c.fields.map(fieldMarkup).join('');
 if(editing){for(const f of c.fields){const el=$('f_'+f[0]);if(!el)continue;let v=editing[f[0]];if(f[0]==='active')v=String(!!v);if(v!==null&&v!==undefined)el.value=String(v);}}
}
function drawTable(){
 const c=config[tab];$('tableTitle').textContent=c.plural;$('tableSubtitle').textContent='منبع داده: public.'+c.table+' · دسترسی بر اساس نشست و سیاست‌های Supabase';
 $('thead').innerHTML='<tr>'+c.cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'<th>عملیات</th></tr>';
 const q=$('search').value.trim().toLocaleLowerCase('fa');
 const filtered=rows.filter(r=>!q||c.cols.some(([k])=>String(fmt(k,r[k])).toLocaleLowerCase('fa').includes(q)));
 if(!filtered.length){$('tbody').innerHTML='<tr><td colspan="'+(c.cols.length+1)+'">موردی برای نمایش وجود ندارد.</td></tr>';return;}
 $('tbody').innerHTML=filtered.map(r=>'<tr>'+c.cols.map(([k])=>'<td>'+esc(fmt(k,r[k]))+'</td>').join('')+'<td><div class="rowactions"><button data-edit="'+esc(r.id)+'">ویرایش</button><button class="danger" data-delete="'+esc(r.id)+'">حذف</button></div></td></tr>').join('');
 $('tbody').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=rows.find(r=>String(r.id)===b.dataset.edit);drawForm();$('formPanel').scrollIntoView({behavior:'smooth',block:'start'});});
 $('tbody').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const item=rows.find(r=>String(r.id)===b.dataset.delete);if(!item||!confirm('این مورد حذف شود؟ این عملیات قابل بازگشت نیست.'))return;try{await api(c.table,'DELETE',null,item.id);showNotice('رکورد حذف شد.','ok');await loadRows();}catch(e){showNotice('حذف انجام نشد: '+e.message,'error');}});
}
async function loadRows(){
 const c=config[tab];$('tbody').innerHTML='<tr><td>در حال دریافت اطلاعات…</td></tr>';
 try{rows=await api(c.table);if(!Array.isArray(rows))rows=[];drawTable();updateMetrics();showNotice('اطلاعات «'+c.plural+'» از Supabase دریافت شد.','ok');}
 catch(e){rows=[];drawTable();showNotice('دریافت '+c.plural+' ناموفق بود. ممکن است نقش حساب یا سیاست دسترسی جدول اجازه ندهد. جزئیات: '+e.message,'error');}
}
async function updateMetrics(){
 try{
  const [records,followups,referrals]=await Promise.all([api('counseling_records'),api('counseling_followups'),api('student_referrals')]);
  $('countRecords').textContent=records.length;
  $('countFollowups').textContent=followups.filter(r=>!['انجام شد','بسته‌شده'].includes(r.status)).length;
  $('countReferrals').textContent=referrals.filter(r=>['در انتظار بررسی','در حال پیگیری'].includes(r.status)).length;
 }catch(e){$('countRecords').textContent='—';$('countFollowups').textContent='—';$('countReferrals').textContent='—';}
}
async function loadStudents(){
 try{students=await api('students');students.sort((a,b)=>String(a.last_name||'').localeCompare(String(b.last_name||''),'fa'));}
 catch(e){students=[];showNotice('فهرست دانش‌آموزان قابل دریافت نیست؛ دسترسی نقش یا سیاست جدول students را بررسی کنید. '+e.message,'error');}
}
async function switchTab(next){
 tab=next;editing=null;for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-selected',String(b.dataset.tab===tab));
 $('search').value='';drawForm();await loadRows();
}
$('entryForm').addEventListener('submit',async e=>{
 e.preventDefault();const c=config[tab];const payload={};
 for(const f of c.fields){const key=f[0],el=$('f_'+key);if(!el)continue;let v=el.value.trim();if(key==='active')v=v==='true';else if(v==='')v=null;payload[key]=v;}
 if(['records','followups','guidance','referrals'].includes(tab)){
  const student=students.find(s=>String(s.id)===String(payload.student_id));
  if(student&&tab==='records')payload.student_name=[student.first_name,student.last_name].filter(Boolean).join(' ');
  if(tab==='records'&&!payload.student_name){showNotice('نام دانش‌آموز باید مشخص باشد.','error');return;}
 }
 $('save').disabled=true;
 try{if(editing)await api(c.table,'PATCH',payload,editing.id);else await api(c.table,'POST',payload);
 editing=null;drawForm();showNotice('اطلاعات با موفقیت در جدول '+c.table+' ذخیره شد.','ok');await loadRows();}
 catch(err){showNotice('ذخیره انجام نشد: '+err.message,'error');}
 finally{$('save').disabled=false;}
});
$('cancelEdit').onclick=()=>{editing=null;drawForm();};
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('search').addEventListener('input',drawTable);
$('refresh').onclick=()=>loadRows();
$('back').onclick=()=>{location.href='portal.html?step=panel&role='+(role==='manager'?'manager':'counselor')};
$('exportCsv').onclick=()=>{
 const c=config[tab],header=c.cols.map(x=>x[1]),data=rows.map(r=>c.cols.map(([k])=>String(fmt(k,r[k])??'').replace(/"/g,'""')));
 const csv='\uFEFF'+[header,...data].map(r=>r.map(v=>'"'+v+'"').join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=c.table+'-frahoosh.csv';a.click();URL.revokeObjectURL(a.href);
};
(async()=>{
 if(!token){showNotice('نشست ورود پیدا نشد. از صفحه اصلی فراهوش دوباره وارد پنل شوید.','error');$('who').textContent='بدون نشست';$('entryForm').querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true);return;}
 if(!allowed.includes(role)){showNotice('این نقش مجاز به بازکردن مرکز مشاوره نیست.','error');$('entryForm').querySelectorAll('input,select,textarea,button').forEach(x=>x.disabled=true);return;}
 $('who').textContent='نقش نشست: '+role+' · داده‌ها از Supabase';
 await loadStudents();for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-selected',String(b.dataset.tab===tab));drawForm();await loadRows();
})();
</script>
</body></html>
