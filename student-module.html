<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730">
<title>پنل دانش‌آموز · فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#11213a;--line:#304461;--text:#f3f6ff;--muted:#a8b8d2;--mint:#63e0c0}
*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#17365a 0,transparent 42%),var(--bg);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--text)}main{max-width:850px;margin:auto}.panel{margin-top:20px;background:#0e1b32dd;border:1px solid #263958;border-radius:18px;padding:22px}.muted{color:var(--muted);line-height:1.9}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--mint)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#203451;color:var(--text);padding:11px 15px}h1{font-size:clamp(22px,4vw,30px)}table{width:100%;border-collapse:collapse;margin-top:12px;background:#11213a}th,td{padding:10px;border-bottom:1px solid #304461;text-align:right;font-size:13px}.empty{margin-top:18px;padding:16px;border:1px solid #8a7040;background:#382c17;color:#ffebbd;border-radius:12px;line-height:1.9}
</style>
</head>
<body><main>
<div class="tag">فراهوش · پنل دانش‌آموز</div>
<section class="panel">
<div class="muted">بخش انتخاب‌شده</div>
<h1 id="moduleTitle">در حال بارگذاری…</h1>
<p id="moduleDescription" class="muted"></p>
<div class="empty" id="status">این صفحه فقط بخش انتخاب‌شده را نمایش می‌دهد. اتصال امن به اطلاعات شخصی دانش‌آموز در مرحلهٔ بعدی انجام می‌شود؛ تا آن زمان هیچ دادهٔ آزمایشی یا ساختگی نمایش داده نمی‌شود.</div>
<div id="gradeResults"></div><p><button id="back" type="button">بازگشت به منوی دانش‌آموز</button></p>
</section>
</main>
<script>
const modules={
'غیبت':'نمایش وضعیت حضور و غیبت خود دانش‌آموز؛ این صفحه برای ثبت یا تغییر غیبت نیست.',
'نمره':'نمایش نمره‌های ثبت‌شده برای حساب دانش‌آموز، بدون امکان تغییر نمره.',
'انضباط':'نمایش موارد انضباطی مرتبط با خود دانش‌آموز، بدون نمایش اطلاعات دیگران.',
'تکلیف':'نمایش تکالیف اختصاص‌یافته به کلاس دانش‌آموز و وضعیت انجام آن‌ها.'
};
const params=new URLSearchParams(location.search);
const selected=params.get('module')||'';
document.getElementById('moduleTitle').textContent=modules[selected]?selected:'بخش نامعتبر';
document.getElementById('moduleDescription').textContent=modules[selected]||'بخش انتخاب‌شده معتبر نیست؛ به منوی پنل برگردید.';
document.getElementById('back').onclick=()=>window.frahooshReturnToPanel('student');
if(!modules[selected])document.getElementById('status').textContent='بخش انتخاب‌شده معتبر نیست.';
if(modules[selected]){
 const token=sessionStorage.getItem('frahoosh_novin_access_token');
 const role=sessionStorage.getItem('frahoosh_novin_role')||'';
 const apiUrl='https://gtmmllcxhdejwjjnyzrh.supabase.co/functions/v1/classroom-management';
 const apiKey='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP';
 const box=document.getElementById('status'),out=document.getElementById('gradeResults');
 const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const table=(heads,rows,empty)=>rows.length?'<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p class="muted">'+esc(empty)+'</p>';
 const approval=x=>x==='approved'?'تأییدشده':x==='pending'?'در انتظار بررسی':x==='rejected'?'ردشده':(x||'ثبت‌شده');
 const needsManagerRelease=(_x)=>false;
 (async()=>{
  if(!token||role!=='student'){box.textContent='نشست دانش‌آموز معتبر نیست؛ از پنل فراهوش دوباره وارد شوید.';return}
  box.textContent='در حال دریافت اطلاعات ثبت‌شده برای حساب شما…';
  try{
   const res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','apikey':apiKey,'Authorization':'Bearer '+token},body:JSON.stringify({action:'student_academic_summary'})});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||!data.ok)throw new Error(data.message||'دریافت اطلاعات دانش‌آموز ناموفق بود.');
   box.textContent='اطلاعات '+esc(data.student?.first_name)+' '+esc(data.student?.last_name)+' · کلاس '+esc(data.student?.class_name);
   const grades=(data.grades||[]).filter(x=>!needsManagerRelease(x)||Number(x.manager_released)===1);
   const adjustments=data.adjustments||[],continuous=data.continuous||[];
   if(selected==='نمره'){
    out.innerHTML='<h2>کارنامه میان‌ترم</h2>'+table(['سال تحصیلی','نوبت','پایه','کلاس','درس','نمره','دبیر','وضعیت'],(data.report_cards||[]).flatMap(card=>(Array.isArray(card.subjects)?card.subjects:[]).map(item=>[card.academic_year,card.term,card.grade,card.class_name,item.subject,item.attendance==='غایب'?'غایب':item.score,item.teacher,item.attendance||'ثبت‌شده'])),'کارنامه میان‌ترمی برای حساب شما ثبت نشده است.');
    out.innerHTML+='<h2>نمره‌های ثبت‌شده دبیران</h2>'+table(['درس','نوع ارزیابی','عنوان','نمره','ضریب','نوبت','تاریخ','وضعیت'],grades.map(x=>[x.subject,x.assessment_type,x.assessment_title,x.score,x.coefficient,x.term,x.grade_date_shamsi,!needsManagerRelease(x)?'ثبت‌شده':Number(x.manager_released)===1?'منتشرشده':'ثبت‌شده؛ در انتظار انتشار مدیر']),'هنوز نمره‌ای ثبت نشده است.');
    out.innerHTML+='<h2>نمره مستمر بر اساس نمره‌های قابل محاسبه</h2>'+table(['درس','نوبت','میانگین پایه','تعدیل','نمره نهایی از ۲۰'],continuous.map(x=>[x.subject,x.term,x.base_score,x.adjustment,x.final_score]),'هنوز نمره‌ای برای محاسبه وجود ندارد.');
    out.innerHTML+='<h2>تعدیلات انضباطی مصوب</h2><p class="muted">جمع تعدیل امتیاز انضباط: '+esc(data.discipline_adjustment||0)+'</p>'+table(['میزان تعدیل','تاریخ اعمال'],adjustments.filter(x=>x.target_score==='discipline').map(x=>[x.delta,x.applied_at]),'تعدیل انضباطی مصوبی ثبت نشده است.');
   }else if(selected==='غیبت'){
    out.innerHTML='<h2>سوابق حضور و غیاب</h2>'+table(['تاریخ','وضعیت','درس','توضیح','وضعیت ثبت'],(data.attendance||[]).map(x=>[x.attendance_date||x.date,x.status,x.subject,x.description,'ثبت‌شده']),'هنوز سابقه حضور و غیابی برای شما ثبت نشده است.');
   }else if(selected==='انضباط'){
    out.innerHTML='<h2>سوابق انضباطی و تشویقی</h2>'+table(['تاریخ','عنوان','نوع ثبت','درس','شرح','وضعیت'],(data.discipline||[]).map(x=>[x.incident_date,x.title,x.record_type==='praise'?'تشویق':'انضباط',x.subject,x.description,'ثبت‌شده']),'هنوز مورد انضباطی یا تشویقی برای شما ثبت نشده است.');
   }else if(selected==='تکلیف'){
    const submissions=data.assignment_submissions||[];
    out.innerHTML='<h2>تکالیف فعال کلاس شما</h2>'+table(['درس','عنوان تکلیف','شرح','تاریخ ثبت','مهلت','وضعیت انجام'],(data.assignments||[]).map(x=>{const sub=submissions.find(y=>Number(y.assignment_id)===Number(x.id));return [x.subject,x.title,x.description,x.created_at,x.due_date,sub?(sub.status||'ارسال‌شده'):'انجام‌نشده']}),'تکلیف فعالی برای کلاس یا حساب شما ثبت نشده است.');
   }
  }catch(e){box.textContent=e.message||'دریافت اطلاعات ناموفق بود.'}
 })();
}
</script>
<script src="panel-return.js?v=20261106-return"></script></body></html>
