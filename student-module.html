<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730">
<title>پنل دانش‌آموز · فراهوش</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#11213a;--line:#304461;--text:#f3f6ff;--muted:#a8b8d2;--mint:#63e0c0}
*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#17365a 0,transparent 42%),var(--bg);font-family:Tahoma,"Segoe UI",sans-serif;color:var(--text)}main{max-width:850px;margin:auto}.panel{margin-top:20px;background:#0e1b32dd;border:1px solid #263958;border-radius:18px;padding:22px}.muted{color:var(--muted);line-height:1.9}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--mint)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#203451;color:var(--text);padding:11px 15px}h1{font-size:clamp(22px,4vw,30px)}table{width:100%;border-collapse:collapse;margin-top:12px;background:#11213a}th,td{padding:10px;border-bottom:1px solid #304461;text-align:right;font-size:13px}.empty{margin-top:18px;padding:16px;border:1px solid #8a7040;background:#382c17;color:#ffebbd;border-radius:12px;line-height:1.9}
</style>
</head>
<body><main>
<div class="tag">فراهوش · پنل دانش‌آموز</div>
<section class="panel">
<div class="muted">بخش انتخاب‌شده</div>
<h1 id="moduleTitle">در حال بارگذاری…</h1>
<p id="moduleDescription" class="muted"></p>
<div class="empty" id="status">این صفحه فقط بخش انتخاب‌شده را نمایش می‌دهد. اتصال امن به اطلاعات شخصی دانش‌آموز در مرحلهٔ بعدی انجام می‌شود؛ تا آن زمان هیچ دادهٔ آزمایشی یا ساختگی نمایش داده نمی‌شود.</div>
<div id="gradeResults"></div><p><button id="back" type="button">بازگشت به منوی دانش‌آموز</button></p>
</section>
</main>
<script>
const modules={
 'غیبت':'نمایش سوابق حضور و غیاب ثبت‌شده برای خود دانش‌آموز.',
 'نمره':'نمایش نمره‌های منتشرشده و تعدیلات مصوب؛ بدون امکان تغییر نمره.',
 'انضباط':'نمایش سوابق انضباطی و تشویقی مرتبط با خود دانش‌آموز.',
 'تکلیف':'نمایش تکالیف کلاس و وضعیت انجام آن‌ها؛ این بخش فقط برای مشاهده است.',
 'فعالیت‌های مدرسه':'ثبت و پیگیری درخواست شرکت در فعالیت‌ها، مسابقات و جشنواره‌های فعال مدرسه.',
 'همیار و شهردار مدرسه':'ثبت درخواست برای شهردار مدرسه و برنامه‌های فعال همیار مدرسه.'
};
const params=new URLSearchParams(location.search);
const selected=params.get('module')||'';
const $=id=>document.getElementById(id);
const token=sessionStorage.getItem('frahoosh_novin_access_token')||'';
const role=sessionStorage.getItem('frahoosh_novin_role')||'';
const apiUrl='https://gtmmllcxhdejwjjnyzrh.supabase.co/functions/v1/classroom-management';
const apiKey='sb_publishable_esNNTGYl6aXb6FlINJxPKA_Dl6KuInP';
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function formatShamsi(value){
 if(!value)return '—';
 const raw=String(value).slice(0,10);
 const date=new Date(raw+'T12:00:00');
 if(Number.isNaN(date.getTime()))return String(value);
 return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
}
function showTable(title,headers,rows,empty){
 const out=$('gradeResults');
 out.innerHTML+='<h2>'+esc(title)+'</h2>';
 if(!rows.length){out.innerHTML+='<p class="muted">'+esc(empty)+'</p>';return;}
 out.innerHTML+='<table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
 rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
function statusLabel(value){
 const labels={present:'حاضر',absent:'غایب',late:'تأخیر',excused:'موجه',done:'انجام‌شده',incomplete:'ناقص',not_done:'انجام‌نشده',pending:'ثبت‌شده؛ در انتظار بررسی',approved:'تأییدشده',rejected:'ردشده',active:'فعال',published:'منتشرشده'};
 return labels[String(value||'').toLowerCase()]||value||'—';
}
async function request(payload){
 const response=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json','apikey':apiKey,'Authorization':'Bearer '+token},body:JSON.stringify({...payload,active_role:'student'})});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.message||'دریافت اطلاعات ناموفق بود.');
 return data;
}
function renderGrades(data){
 const rows=data.grades||[],adjustments=data.adjustments||[],continuous=data.continuous||[];
 showTable('نمره‌های منتشرشده',['درس','نوع ارزیابی','عنوان','نمره','ضریب','نوبت','تاریخ'],rows.map(x=>[x.subject,x.assessment_type,x.assessment_title,x.score,x.coefficient,x.term,x.grade_date_shamsi]),'هنوز نمره‌ای برای نمایش منتشر نشده است.');
 showTable('نمره مستمر نهایی پس از تعدیلات مصوب',['درس','نوبت','میانگین پایه','تعدیل','نمره نهایی از ۲۰'],continuous.map(x=>[x.subject,x.term,x.base_score,x.adjustment,x.final_score]),'برای محاسبه مستمر، نمره منتشرشده‌ای وجود ندارد.');
 const discipline=adjustments.filter(x=>x.target_score==='discipline');
 $('gradeResults').innerHTML+='<h2>تعدیلات انضباطی مصوب</h2><p class="muted">جمع تعدیل امتیاز انضباط: '+esc(data.discipline_adjustment||0)+'</p>';
 showTable('جزئیات تعدیلات انضباطی',['میزان تعدیل','تاریخ اعمال'],discipline.map(x=>[x.delta,formatShamsi(x.applied_at)]),'تعدیل انضباطی مصوبی ثبت نشده است.');
}
function renderModule(data){
 if(selected==='غیبت'){
  showTable('سوابق حضور و غیاب',['تاریخ','وضعیت','درس','توضیح','وضعیت تأیید'],(data.attendance||[]).map(x=>[formatShamsi(x.attendance_date||x.date),statusLabel(x.status),x.subject,x.description,statusLabel(x.approval_status)]),'سابقه حضور و غیابی برای این حساب ثبت نشده است.');
 }else if(selected==='انضباط'){
  showTable('سوابق انضباطی و تشویقی',['تاریخ','نوع','عنوان','درس','توضیحات','وضعیت'],(data.discipline||[]).map(x=>[formatShamsi(x.incident_date),x.record_type==='praise'?'تشویق':'انضباط',x.title,x.subject,x.description,statusLabel(x.status)]),'سابقه انضباطی یا تشویقی برای این حساب ثبت نشده است.');
 }else if(selected==='تکلیف'){
  showTable('تکالیف اختصاص‌یافته',['درس','عنوان تکلیف','شرح','مهلت','وضعیت انجام','تاریخ ارسال'],(data.assignments||[]).map(x=>[x.subject,x.title,x.description,formatShamsi(x.due_date),statusLabel(x.submission_status),formatShamsi(x.submitted_at)]),'تکلیفی برای کلاس یا حساب شما ثبت نشده است.');
 }else if(selected==='فعالیت‌های مدرسه'||selected==='همیار و شهردار مدرسه'){
  renderActivities(data);
 }
}
function renderActivities(data){
 const out=$('gradeResults'),programs=data.programs||[],registrations=data.registrations||[];
 const findRegistration=id=>{const latest=registrations.find(x=>Number(x.activity_id)===Number(id));return latest&&String(latest.status||'').toLowerCase()!=='rejected'?latest:undefined;};
 const statusText=x=>x?'<span class="tag">'+esc(statusLabel(x.status))+'</span>':'';
 const button=(type,label,extra='')=>'<button type="button" data-register="'+esc(type)+'" '+extra+'>'+esc(label)+'</button>';
 const card=(title,description,existing,action)=>'<article class="panel"><h3>'+esc(title)+'</h3><p class="muted">'+esc(description)+'</p>'+(existing?'<p>'+statusText(existing)+'</p>':action)+'</article>';
 const currentYear=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric'}).format(new Date()).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));
 const electionYear=currentYear+'-'+String(Number(currentYear)+1).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
 let html='<p class="muted">درخواست‌ها با وضعیت «در انتظار بررسی» ثبت می‌شوند و نتیجه پس از بررسی مدرسه در همین صفحه نمایش داده می‌شود.</p>';
 if(selected==='فعالیت‌های مدرسه'){
  const councilRecord=(data.council||[]).find(x=>x.election_year===electionYear),basijRecord=(data.basij||[])[0];
  const council=councilRecord&&String(councilRecord.status||'').toLowerCase()!=='rejected'?councilRecord:undefined;
  const basij=basijRecord&&String(basijRecord.status||'').toLowerCase()!=='rejected'?basijRecord:undefined;
  html+=card('شورای دانش‌آموزی','درخواست نامزدی یا عضویت در شورای دانش‌آموزی برای سال تحصیلی انتخاب‌شده.',council,council?'':('<label>سال تحصیلی انتخابات <input id="electionYear" value="'+esc(electionYear)+'" maxlength="20"></label>'+button('council','ثبت درخواست شورا')));
  html+=card('بسیج دانش‌آموزی','ثبت درخواست عضویت و ارسال آن برای بررسی مسئول مربوطه.',basij,button('basij','ثبت درخواست عضویت'));
  const visiblePrograms=programs.filter(p=>!String(p.category||'').includes('همیار'));
  html+='<h2>مسابقات، جشنواره‌ها و فعالیت‌های فعال</h2>';
  if(!visiblePrograms.length)html+='<p class="muted">در حال حاضر برنامه فعالی برای ثبت‌نام در این بخش از سوی مدرسه تعریف نشده است.</p>';
  for(const p of visiblePrograms){
   const existing=findRegistration(p.id);
   const action=existing?'':'<label>نوع مشارکت <select id="participation-'+Number(p.id)+'"><option value="فردی">فردی</option><option value="گروهی">گروهی</option></select></label><label>نام هم‌گروهی‌ها (در صورت گروهی بودن) <input id="team-'+Number(p.id)+'" maxlength="1000"></label>'+button('activity','ثبت‌نام در این برنامه','data-activity-id="'+Number(p.id)+'"');
   html+=card(p.title,(p.category||'فعالیت مدرسه')+(p.event_date?' · تاریخ: '+formatShamsi(p.event_date):'')+(Number(p.amount)>0?' · مبلغ اعلام‌شده: '+Number(p.amount).toLocaleString('fa-IR'):'') ,existing,action);
  }
 }else{
  const mayorRecord=(data.mayor||[])[0];
  const mayor=mayorRecord&&String(mayorRecord.status||'').toLowerCase()!=='rejected'?mayorRecord:undefined;
  html+=card('شهردار مدرسه','ثبت درخواست داوطلبی برای مسئولیت شهردار مدرسه.',mayor,button('mayor','ثبت درخواست شهردار مدرسه'));
  const helperPrograms=programs.filter(p=>String(p.category||'').includes('همیار')||String(p.title||'').includes('همیار'));
  html+='<h2>برنامه‌های همیار مدرسه</h2>';
  if(!helperPrograms.length)html+='<p class="muted">مدرسه هنوز برنامه فعالی برای همیار مدرسه تعریف نکرده است.</p>';
  for(const p of helperPrograms){
   const existing=findRegistration(p.id);
   const action=existing?'':button('activity','ثبت درخواست همیاری','data-activity-id="'+Number(p.id)+'"');
   html+=card(p.title,p.category||'همیار مدرسه',existing,action);
  }
 }
 out.innerHTML=html;
 out.querySelectorAll('[data-register]').forEach(control=>control.addEventListener('click',async()=>{
  const type=control.dataset.register;
  const payload={action:'student_activity_portal',operation:'register',registration_type:type};
  if(type==='council')payload.election_year=$('electionYear')?.value.trim()||'';
  if(type==='basij')payload.registration_date=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  if(type==='activity'){
   const id=Number(control.dataset.activityId);
   payload.activity_id=id;
   payload.participation_type=$('participation-'+id)?.value||'فردی';
   payload.team_members=$('team-'+id)?.value||'';
  }
  control.disabled=true;
  try{
   const result=await request(payload);
   $('status').textContent='درخواست شما ثبت شد و برای بررسی به مدرسه ارسال شد.';
   const refreshed=await request({action:'student_activity_portal',operation:'list'});
   renderActivities(refreshed);
  }catch(error){
   $('status').textContent=error.message;
   control.disabled=false;
  }
 }));
}
async function main(){
 $('moduleTitle').textContent=modules[selected]?selected:'بخش نامعتبر';
 $('moduleDescription').textContent=modules[selected]||'بخش انتخاب‌شده معتبر نیست؛ به منوی پنل برگردید.';
 $('back').onclick=()=>location.href='portal.html?step=panel&role=student';
 if(!modules[selected]){$('status').textContent='بخش انتخاب‌شده معتبر نیست.';return;}
 if(!token||role!=='student'){$('status').textContent='نشست دانش‌آموز معتبر نیست؛ از پنل فراهوش دوباره وارد شوید.';return;}
 $('status').textContent='در حال دریافت اطلاعات ثبت‌شده برای حساب شما…';
 try{
  const activityModule=selected==='فعالیت‌های مدرسه'||selected==='همیار و شهردار مدرسه';
  const data=selected==='نمره'?await request({action:'student_academic_summary'}):activityModule?await request({action:'student_activity_portal',operation:'list'}):await request({action:'student_module_summary',module:selected});
  const student=data.student||{};
  $('status').textContent='اطلاعات '+(student.first_name||'')+' '+(student.last_name||'')+' · کلاس '+(student.class_name||'ثبت نشده');
  if(selected==='نمره')renderGrades(data);else renderModule(data);
 }catch(error){$('status').textContent=error.message;}
}
main();
</script>
</body></html>
